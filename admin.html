<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AURIX COMMAND CENTER</title><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#07080c;--g:#12141b;--g2:#1a1d27;--line:rgba(255,255,255,.08);--tx:#e8eaf2;--mu:#8b90a3;--b:#3ea6ff;--v:#8b5cf6;--ok:#34d399;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.22),transparent 60%),radial-gradient(700px 400px at -5% 110%,rgba(62,166,255,.16),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{margin:0 0 .5em;letter-spacing:-.01em}.mu{color:var(--mu)}.sm{font-size:.85rem}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(14px)}
input,select,textarea{width:100%;background:#0b0c11;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin:4px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:transparent}textarea{min-height:90px}
label{font-size:.82rem;color:var(--mu)}
.btn{background:linear-gradient(90deg,var(--b),var(--v));color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;font:inherit;font-weight:600;transition:.2s;box-shadow:0 0 18px rgba(62,166,255,.25)}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:wait}
.btn.o{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--tx)}.btn.o:hover{border-color:var(--b)}
.btn.d{background:transparent;border:1px solid rgba(248,113,113,.4);color:var(--bad);box-shadow:none}.btn.s{padding:5px 11px;font-size:.8rem;margin:2px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}#login .glass{width:100%;max-width:400px}
.logo{font-weight:800;letter-spacing:.3em;background:linear-gradient(90deg,var(--b),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
#app{display:none;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 12px;background:rgba(10,11,16,.7);position:sticky;top:0;height:100vh;overflow:auto}
aside a{display:block;padding:10px 14px;border-radius:10px;color:var(--mu);text-decoration:none;margin-bottom:3px;transition:.2s}
aside a:hover{color:var(--tx);background:var(--g2)}aside a.on{color:#fff;background:linear-gradient(90deg,rgba(62,166,255,.22),rgba(139,92,246,.22));box-shadow:inset 2px 0 var(--b)}
main{padding:24px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat b{display:block;font-size:1.9rem;background:linear-gradient(90deg,var(--b),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;white-space:nowrap}th{color:var(--mu);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.pill{padding:2px 10px;border-radius:99px;font-size:.74rem;border:1px solid var(--line)}.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}.bad{color:var(--bad);border-color:rgba(248,113,113,.4)}.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:99}#toast div{background:var(--g2);border:1px solid var(--line);border-left:3px solid var(--b);padding:10px 16px;border-radius:10px;animation:in .3s}#toast .e{border-left-color:var(--bad)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;place-items:center;z-index:98;padding:20px}#modal .glass{background:var(--g);max-width:420px;width:100%}
.burger{display:none}.spin{color:var(--mu);padding:30px;text-align:center}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:fixed;left:-250px;width:230px;z-index:60;transition:.25s;background:#0b0c11}aside.open{left:0}.burger{display:inline-block}}
</style></head><body>
<div id="login"><form class="glass" id="lf"><h2 class="logo">AURIX</h2><p class="mu sm" style="margin-top:-8px">COMMAND CENTER · Complete Control. Intelligent Management.</p>
<div id="cfgwarn" class="pill warn" style="display:none;margin-bottom:12px;border-radius:10px;padding:8px">Fill in config.js (Supabase URL and anon key) first.</div>
<label>Admin email</label><input id="em" type="email" autocomplete="username" value="najimnajim75599@gmail.com" readonly required>
<label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
<div id="mfa" style="display:none"><label>2FA code</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
<button class="btn" style="width:100%" id="lb">Sign in</button><button class="btn o" style="width:100%;margin-top:8px" id="forgot" type="button">Send password reset link</button><p class="mu sm" id="authmsg" role="status" aria-live="polite"></p></form></div>
<div id="app"><aside id="side"><h3 class="logo" style="padding:0 14px">AURIX</h3><nav id="nav"></nav></aside>
<main><div class="top"><div><button class="btn o s burger" onclick="side.classList.toggle('open')">☰</button> <b id="title" style="font-size:1.4rem"></b></div><div><span class="pill ok" id="role"></span> <span class="mu sm" id="who"></span> <button class="btn o s" id="out">Sign out</button></div></div><div id="view"></div></main></div>
<div id="toast"></div><div id="modal"><div class="glass"><h3 id="mt"></h3><p class="mu" id="mb"></p><div style="text-align:right"><button class="btn o s" id="mn">Cancel</button> <button class="btn d s" id="my">Confirm</button></div></div></div>
<script src="config.js"></script>
<script>
/* Public values only (the anon key is designed to be public; RLS protects data). NEVER put passwords or the service_role key here. */
const {SUPABASE_URL="",SUPABASE_ANON_KEY=""}=window.AURIX_CONFIG||{};
const ADMIN_EMAIL="najimnajim75599@gmail.com";
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleString():"–",sz=n=>n?(n>1e6?(n/1e6).toFixed(1)+" MB":(n/1e3).toFixed(0)+" KB"):"–";
if(!SUPABASE_URL||!SUPABASE_ANON_KEY)$("#cfgwarn").style.display="block";
const sb=SUPABASE_URL?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}):null;let role=null,me=null,idleTimer=null,recoveryActive=/type=recovery/.test(location.hash)||new URLSearchParams(location.search).get("type")==="recovery";
function toast(m,err){const d=document.createElement("div");d.textContent=m;if(err)d.className="e";$("#toast").append(d);setTimeout(()=>d.remove(),4000)}
function ask(t,b){return new Promise(r=>{$("#mt").textContent=t;$("#mb").textContent=b;$("#modal").style.display="grid";$("#my").onclick=()=>{$("#modal").style.display="none";r(true)};$("#mn").onclick=()=>{$("#modal").style.display="none";r(false)}})}
async function log(a,d){try{await sb.rpc("log_action",{a,d})}catch(e){}}
async function run(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){toast(e.message||String(e),1)}finally{if(btn)btn.disabled=false}}
const ok=r=>{if(r.error)throw r.error;return r.data};
async function saveSiteSettings(rows){const payload=rows.map(row=>{const key=String(row?.key??"").trim();if(!key)throw new Error("A website setting is missing its key.");return{key,value:String(row?.value??"")}});ok(await sb.from("site_settings").upsert(payload))}
function resetIdleTimer(){if(!me)return;clearTimeout(idleTimer);idleTimer=setTimeout(async()=>{await log("idle_logout","");await sb.auth.signOut({scope:"local"});location.hash="";location.reload()},30*60*1000)}
["pointerdown","keydown","touchstart"].forEach(event=>addEventListener(event,resetIdleTimer,{passive:true}));
/* ---------- auth ---------- */
$("#lf").onsubmit=e=>{e.preventDefault();run($("#lb"),async()=>{
 if(!sb)throw Error("Supabase is not configured");
 if($("#mfa").style.display==="block"){const f=ok(await sb.auth.mfa.listFactors()).totp[0];ok(await sb.auth.mfa.challengeAndVerify({factorId:f.id,code:$("#code").value.trim()}));return boot()}
 const r=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
 if(r.error){await log("failed_login",$("#em").value);throw r.error}
 const a=ok(await sb.auth.mfa.getAuthenticatorAssuranceLevel());
 if(a.nextLevel==="aal2"&&a.currentLevel!=="aal2"){$("#mfa").style.display="block";return toast("Enter your 2FA code")}
 await boot()})};
$("#forgot").onclick=e=>run(e.target,async()=>{if(!sb)throw Error("Supabase is not configured");const{error}=await sb.auth.resetPasswordForEmail(ADMIN_EMAIL,{redirectTo:new URL("admin.html",location.href).href});if(error)throw error;$("#authmsg").textContent="If the authorized account is registered, a password reset link has been sent."});
$("#out").onclick=async()=>{await log("logout","");await sb.auth.signOut({scope:"global"});location.hash="";location.reload()};
function renderPasswordForm(required=false){
 $("#login").style.display="grid";$("#app").style.display="none";
 $("#login").innerHTML=`<form class="glass" id="passwordForm"><h2 class="logo">AURIX</h2><p class="mu sm">${required?"Set a new password before opening the command center.":"Choose a new password for your AURIX admin account."}</p><label>New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label>Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><p class="mu sm" id="passwordError" role="alert"></p><button class="btn" style="width:100%" id="savePassword">Update password</button></form>`;
 $("#passwordForm").onsubmit=e=>{e.preventDefault();run($("#savePassword"),async()=>{const password=$("#newPassword").value;if(password.length<12)throw Error("Use at least 12 characters.");if(password!==$("#confirmPassword").value)throw Error("Passwords do not match.");ok(await sb.auth.updateUser({password}));await log("password_changed","");if(recoveryActive){await sb.auth.signOut({scope:"global"});location.hash="";location.reload();return}await boot()})};
}
async function boot(){const u=ok(await sb.auth.getUser()).user;
 if(!u||!u.email_confirmed_at||(u.email||"").toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut({scope:"global"});throw Error("This verified account is not authorized for the AURIX admin panel")}
 role=ok(await sb.rpc("my_role"));
 if(role!=="super_admin"){await sb.auth.signOut({scope:"global"});throw Error("This account is not an AURIX administrator")}
 if(ok(await sb.rpc("admin_password_change_required"))){renderPasswordForm(true);return}
 me=u;resetIdleTimer();await log("login","");$("#login").style.display="none";$("#app").style.display="grid";$("#who").textContent=u.email;$("#role").textContent=role==="super_admin"?"SUPER ADMIN":"MODERATOR";nav();route()}
sb&&sb.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY"){recoveryActive=true;renderPasswordForm(false)}});
sb&&sb.auth.getSession().then(({data})=>{if(data.session&&!recoveryActive)boot().catch(e=>toast(e.message||"Admin sign-in failed",1))});
/* ---------- router ---------- */
const P={dashboard:["Dashboard",dash],users:["Users",users],releases:["Software & Releases",rels],files:["Cloud Storage",files],announce:["Announcements",anns],site:["Website",site],features:["AURIX Features",features],profile:["Developer Profile",prof],monitor:["System Monitor",mon],logs:["Activity & Security Logs",logs],account:["My Account & Security",acct]};
function nav(){$("#nav").innerHTML=Object.entries(P).map(([k,v])=>`<a href="#${k}" data-k="${k}">${v[0]}</a>`).join("")}
function route(){const k=P[location.hash.slice(1)]?location.hash.slice(1):"dashboard";document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.k===k));$("#title").textContent=P[k][0];$("#side").classList.remove("open");$("#view").innerHTML='<div class="spin">Loading…</div>';let timeoutId;const timeout=new Promise((_,reject)=>{timeoutId=setTimeout(()=>reject(new Error("The Supabase request timed out.")),10000)});const request=Promise.resolve().then(()=>P[k][1]());Promise.race([request,timeout]).catch(error=>{const fileHelp=location.protocol==="file:"?'<p class="mu sm">This page is opened directly from disk. Use the local HTTP admin at <a href="http://127.0.0.1:8000/admin.html">http://127.0.0.1:8000/admin.html</a> so browser storage and Supabase requests have a normal origin.</p>':"";$("#view").innerHTML=`<div class="glass"><span class="pill bad">${error.message==="The Supabase request timed out."?"Request timed out":"Request failed"}</span><p>${E(error.message||"Supabase request failed.")}</p>${fileHelp}<button class="btn o s" id="retryRoute" type="button">Retry</button></div>`;$("#retryRoute").onclick=route}).finally(()=>clearTimeout(timeoutId))}
addEventListener("hashchange",()=>me&&route());
const V=h=>$("#view").innerHTML=h,sup=()=>role==="super_admin";
/* ---------- dashboard ---------- */
async function dash(){const t0=performance.now(),d7=new Date(Date.now()-7*864e5).toISOString(),d14=new Date(Date.now()-14*864e5).toISOString();
 const cnt=(t,f)=>{let q=sb.from(t).select("*",{count:"exact",head:true});return f?f(q):q};
 const [u,act,nw,rl,ann,pr,lg,latest,featureRows]=await Promise.all([cnt("profiles"),cnt("profiles",q=>q.eq("status","active")),cnt("profiles",q=>q.gte("created_at",d7)),sb.from("releases").select("downloads,version,is_latest"),cnt("announcements",q=>q.eq("active",true)),sb.from("profiles").select("created_at").gte("created_at",d14),sb.from("admin_logs").select("*").order("created_at",{ascending:false}).limit(6),sb.from("profiles").select("email,full_name,created_at").order("created_at",{ascending:false}).limit(5),sb.from("site_settings").select("key,value").in("key",["feature_memory_enabled","feature_find_enabled","feature_flow_enabled","feature_connect_enabled","feature_activity_enabled"])]);
 const rel=ok(rl),dl=rel.reduce((a,r)=>a+r.downloads,0),lat=Math.round(performance.now()-t0),days={};
 const configuredFeatures=Object.fromEntries(ok(featureRows).map(row=>[row.key,row.value])),visibleFeatures=["memory","find","flow","connect","activity"].filter(key=>configuredFeatures[`feature_${key}_enabled`]!=="false").length;
 for(let i=13;i>=0;i--)days[new Date(Date.now()-i*864e5).toISOString().slice(5,10)]=0;ok(pr).forEach(p=>{const k=p.created_at.slice(5,10);if(k in days)days[k]++});
 const mx=Math.max(1,...Object.values(days));
 const bars=Object.entries(days).map(([k,v],i)=>`<g><rect x="${i*34+6}" y="${110-v/mx*100}" width="24" height="${v/mx*100}" rx="5" fill="url(#g)"><title>${k}: ${v}</title></rect><text x="${i*34+18}" y="126" fill="#8b90a3" font-size="9" text-anchor="middle">${k.slice(3)}</text></g>`).join("");
 V(`<div class="cards">${[["Registered users",u.count],["Active users",act.count],["New (7 days)",nw.count],["Total downloads",dl],["Releases",rel.length],["Active announcements",ann.count],["Visible app features",visibleFeatures],["API latency",lat+" ms"]].map(([a,b])=>`<div class="glass stat"><span class="mu sm">${a}</span><b>${b??0}</b></div>`).join("")}</div><p class="mu sm">Website visitors, revenue, orders, and local app feature usage are not collected by this AURIX project.</p>
 <div class="glass" style="margin-bottom:16px"><h3>Registrations · last 14 days</h3><div class="tw"><svg viewBox="0 0 480 132" width="100%" style="min-width:420px"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ea6ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>${bars}</svg></div></div>
 <div class="glass" style="margin-bottom:16px"><h3>Recent registrations</h3>${tbl(["Name","Email","Registered"],ok(latest).map(p=>[p.full_name||"—",p.email,fmt(p.created_at)]))}</div>
 <div class="glass"><h3>Recent activity</h3>${tbl(["When","Admin","Action","Detail"],ok(lg).map(l=>[fmt(l.created_at),l.admin_email,l.action,l.detail]))}</div>`)}
function tbl(h,rows){return`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${typeof c==="object"&&c?c.h:E(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${h.length}" class="mu">Nothing here yet.</td></tr>`}</table></div>`}
const H=h=>({h});
/* ---------- users ---------- */
async function users(){const pr=ok(await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(500));
 V(`<div class="glass"><p class="mu sm">Account status is stored on the profile. The public AURIX website currently has no customer sign-in flow, so this flag does not revoke existing authentication sessions.</p><div class="row"><div><label>Search email / name</label><input id="q"></div><div><label>Profile status</label><select id="sf"><option value="">All</option><option>active</option><option>suspended</option></select></div></div><div id="ut"></div></div>`);
 const draw=()=>{const q=$("#q").value.toLowerCase(),s=$("#sf").value;$("#ut").innerHTML=tbl(["Email","Name","Registered","Profile flag","Account type","Actions"],pr.filter(p=>(!s||p.status===s)&&((p.email||"")+(p.full_name||"")).toLowerCase().includes(q)).map(p=>[p.email,p.full_name,fmt(p.created_at),H(`<span class="pill ${p.status==="active"?"ok":"bad"}">${p.status}</span>`),p.id===me.id?"Primary admin":"User",H(`<button class="btn o s" data-a="profile" data-id="${p.id}">Profile</button>${p.id!==me.id?`<button class="btn o s" data-a="tog" data-id="${p.id}">${p.status==="active"?"Mark suspended":"Reactivate"}</button>`:'<span class="mu sm">Protected</span>'}`+(sup()&&p.id!==me.id?`<button class="btn d s" data-a="del" data-id="${p.id}">Delete</button>`:"")+`<button class="btn o s" data-a="act" data-id="${p.id}">Logs</button>`)]));};
 draw();$("#q").oninput=draw;$("#sf").onchange=draw;
 $("#view").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const p=pr.find(x=>x.id===b.dataset.id);run(b,async()=>{
  if(b.dataset.a==="profile"){alert(`Email: ${p.email||"—"}\nName: ${p.full_name||"—"}\nRegistered: ${fmt(p.created_at)}\nStatus: ${p.status}\nUser ID: ${p.id}`)}
  if(b.dataset.a==="tog"){const ns=p.status==="active"?"suspended":"active";if(!await ask(ns==="suspended"?"Mark profile suspended?":"Reactivate profile?",`${p.email}\nThis updates the profile flag only; AURIX currently has no customer session system to revoke.`))return;ok(await sb.from("profiles").update({status:ns}).eq("id",p.id));await log("profile_"+ns,p.email);toast("Profile status updated");users()}
  if(b.dataset.a==="del"){if(!await ask("Permanently delete "+p.email+"?","This removes the account and cannot be undone."))return;ok(await sb.rpc("admin_delete_user",{uid:p.id}));await log("account_deleted",p.email);toast("Deleted");users()}
  if(b.dataset.a==="act"){const l=ok(await sb.from("admin_logs").select("*").ilike("detail","%"+p.email+"%").order("created_at",{ascending:false}).limit(20));alert(l.length?l.map(x=>fmt(x.created_at)+"  "+x.action+" by "+x.admin_email).join("\n"):"No admin actions recorded for this user.")}})}}
/* ---------- releases ---------- */
async function rels(){const r=ok(await sb.from("releases").select("*").order("created_at",{ascending:false}));
 V(`<div class="glass" style="margin-bottom:16px"><h3>Upload new release</h3><div class="row"><div><label>Version (e.g. 1.0.0)</label><input id="rv"></div><div><label>Minimum supported version</label><input id="rm"></div><div><label>Platform</label><select id="rp"><option>windows</option><option>android</option><option>other</option></select></div><div><label>File (.exe / .zip / .apk)</label><input id="rf" type="file" accept=".exe,.zip,.apk"></div></div><label>Release notes</label><textarea id="rn"></textarea><button class="btn" id="ru">Upload &amp; save as draft</button> <span class="mu sm" id="rs"></span></div>
 <div class="glass"><h3>All versions</h3><p class="mu sm">A release is live on the website only when it is marked live and downloads are enabled.</p>${tbl(["Version","Platform","Size","Downloads","Status","Actions"],r.map(x=>[x.version,x.platform,sz(x.file_size),x.downloads,H(`<span class="pill ${x.published&&x.is_latest&&x.downloads_enabled?"ok":x.published?"warn":"warn"}">${x.published&&x.is_latest&&x.downloads_enabled?"live":x.published?"published · not live":"draft"}</span> ${x.downloads_enabled?"":'<span class="pill bad">downloads off</span>'}`),H(`<button class="btn o s" data-a="pub" data-id="${x.id}"${!x.published&&!x.downloads_enabled?" disabled":""}>${x.published?"Unpublish":x.downloads_enabled?"Publish &amp; set live":"Enable downloads first"}</button><button class="btn o s" data-a="dl" data-id="${x.id}">${x.downloads_enabled?"Disable DL":"Enable DL"}</button><button class="btn o s" data-a="lat" data-id="${x.id}"${!x.published||!x.downloads_enabled||x.is_latest?" disabled":""}>${x.is_latest?"Current live release":"Make live"}</button><button class="btn d s" data-a="del" data-id="${x.id}">Delete</button>`)]))}</div>`);
 $("#ru").onclick=e=>run(e.target,async()=>{const v=$("#rv").value.trim(),f=$("#rf").files[0];if(!/^\d+\.\d+(\.\d+)?$/.test(v))throw Error("Version must look like 1.0.0");if(!f)throw Error("Choose a file");if(!/\.(exe|zip|apk)$/i.test(f.name))throw Error("Only .exe, .zip, .apk allowed");
  $("#rs").textContent="Uploading "+sz(f.size)+"…";const path=v+"/"+f.name.replace(/[^\w.\-]/g,"_");ok(await sb.storage.from("releases").upload(path,f,{upsert:true}));
  const url=sb.storage.from("releases").getPublicUrl(path).data.publicUrl;ok(await sb.from("releases").insert({version:v,platform:$("#rp").value,file_path:path,file_url:url,file_size:f.size,notes:$("#rn").value,min_version:$("#rm").value||null}));await log("software_upload",v+" "+f.name);toast("Uploaded as draft");rels()});
 $("#view").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const x=r.find(q=>q.id===b.dataset.id);run(b,async()=>{const a=b.dataset.a;
  if(a==="pub"){const result=await sb.rpc(x.published?"unpublish_release":"publish_release",{rid:x.id});if(result.error){if(result.error.code!=="PGRST202")throw result.error;if(x.published){ok(await sb.from("releases").update({published:false,is_latest:false}).eq("id",x.id));const fallback=r.filter(item=>item.id!==x.id&&item.platform===x.platform&&item.published&&item.downloads_enabled).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];if(fallback)ok(await sb.rpc("set_latest",{rid:fallback.id}))}else{if(!x.downloads_enabled)throw new Error("Enable downloads before publishing this release.");ok(await sb.from("releases").update({published:true}).eq("id",x.id));ok(await sb.rpc("set_latest",{rid:x.id}))}}await log(x.published?"release_unpublished":"release_published",x.version)}

async function files(){const buckets=["releases","site-assets"],all=[];

 const used=all.reduce((a,f)=>a+(f.metadata?.size||0),0);
 V(`<div class="glass" style="margin-bottom:16px"><h3>Upload website image</h3><label>JPG, PNG or WebP (max 5 MB)</label><input id="assetUpload" type="file" accept="image/jpeg,image/png,image/webp"><p class="mu sm">Images are stored in the shared Supabase site-assets bucket and can be used by the live website.</p></div><div class="cards"><div class="glass stat"><span class="mu sm">Files</span><b>${all.length}</b></div><div class="glass stat"><span class="mu sm">Used by listed files</span><b>${sz(used)}</b></div></div><div class="glass">${tbl(["Bucket / path","Size","Uploaded","Actions"],all.map(f=>[f.bucket+" / "+f.p,sz(f.metadata?.size),fmt(f.created_at),H(`<a class="btn o s" style="text-decoration:none;display:inline-block" href="${E(sb.storage.from(f.bucket).getPublicUrl(f.p).data.publicUrl)}" target="_blank" rel="noopener">Open</a><button class="btn d s" data-bucket="${f.bucket}" data-p="${E(f.p)}">Delete</button>`)]))}</div>`);

 $("#view").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;run(b,async()=>{const bucket=b.dataset.bucket,path=b.dataset.p;if(bucket==="releases"){const linked=ok(await sb.from("releases").select("version").eq("file_path",path));if(linked.length)throw Error("Delete the linked release record from Software & Releases before removing this file.")}if(bucket==="site-assets"){const settings=ok(await sb.from("site_settings").select("value").eq("key","hero_image_path").maybeSingle());if(settings?.value===path)throw Error("This is the active homepage banner image. Replace it before deleting.")}if(!await ask("Delete file?",path))return;ok(await sb.storage.from(bucket).remove([path]));await log("file_deleted",bucket+"/"+path);files()})}}

const SK=[["seo_title","SEO page title","t"],["seo_description","SEO description","a"],["seo_keywords","SEO keywords","t"],["hero_eyebrow","Hero eyebrow","t"],["hero_title","Hero title (use a new line for the second line)","a"],["hero_lead","Hero description","a"],["hero_cta_primary","Primary button label","t"],["hero_cta_secondary","Secondary button label","t"],["banner_text","Announcement banner","t"],["download_note","Download note","t"],["contact_email","Contact email","t"],["instagram_url","Instagram URL","t"],["privacy_text","Privacy section content","a"],["faqs","Homepage FAQs (one per line: Question | Answer)","a"],["footer_tagline","Footer tagline","t"],["footer_note","Footer note","t"],["footer_copyright","Footer copyright text","t"]];

async function site(){const s=Object.fromEntries(ok(await sb.from("site_settings").select("*")).map(r=>[r.key,r.value]));
 V(`<div class="glass" style="margin-bottom:16px"><h3>Homepage and metadata</h3>${SK.map(([k,l,t])=>`<label>${l}</label>${t==="a"?`<textarea data-k="${k}">${E(k==="faqs"?(s[k]||DEFAULT_FAQS):(s[k]||""))}</textarea>`:`<input data-k="${k}" ${k==="contact_email"?"type=email":k==="instagram_url"?"type=url":"type=text"} value="${E(s[k]||"")}">`}`).join("")}<label>Hero banner image (JPG, PNG or WebP; max 5 MB)</label><input id="heroImage" type="file" accept="image/jpeg,image/png,image/webp"><p class="mu sm">${s.hero_image_url?`Current image: <a href="${E(s.hero_image_url)}" target="_blank" rel="noopener">Open image</a>`:"No uploaded image"}</p></div>
 <div class="glass" style="margin-bottom:16px"><h3>Navigation and page visibility</h3>${NAV_KEYS.map(([key,label])=>`<label>${label} link label</label><input data-k="nav_${key}" value="${E(s[`nav_${key}`]||"")}">`).join("")}${SITE_TOGGLES.map(([k,l])=>`<label class="check"><input type="checkbox" data-k="${k}"${s[k]!=="false"?" checked":""}>${l}</label>`).join("")}</div>
 <div class="glass"><h3>Maintenance mode</h3><label>Public message</label><textarea data-k="maintenance_message">${E(s.maintenance_message||"AURIX is temporarily unavailable while we make updates. Please check back soon.")}</textarea><label class="check"><input type="checkbox" data-k="maintenance_mode"${s.maintenance_mode==="true"?" checked":""}>Enable maintenance mode on the public homepage</label><button class="btn" id="ss" style="margin-top:16px">Save website settings</button><p class="mu sm">Settings are shared through Supabase and applied by the existing AURIX homepage. Published releases and announcements remain managed in their sections.</p></div>`);
 $("#ss").onclick=e=>run(e.target,async()=>{const rows=[...document.querySelectorAll("#view [data-k]")].map(i=>({key:i.dataset.k,value:i.type==="checkbox"?String(i.checked):i.value.trim()}));const title=rows.find(r=>r.key==="seo_title")?.value;if(title.length>120)throw Error("SEO title must be 120 characters or fewer");const email=rows.find(r=>r.key==="contact_email")?.value;if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error("Enter a valid contact email address");const social=rows.find(r=>r.key==="instagram_url")?.value;if(social){let parsed;try{parsed=new URL(social)}catch{throw Error("Enter a valid Instagram URL")};if(parsed.protocol!=="https:")throw Error("Instagram URL must use HTTPS")};const faqText=rows.find(r=>r.key==="faqs")?.value||"";if(faqText.split(/\r?\n/).filter(line=>line.trim()).some(line=>!line.includes("|")))throw Error("Each FAQ line must contain a question and answer separated by |");await saveSiteSettings(rows);await log("site_settings_changed",rows.map(r=>r.key).join(","));toast("Saved to the live website")});
 $("#heroImage").onchange=e=>run(null,async()=>{const file=e.target.files[0];if(!file)return;if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error("Use a JPG, PNG or WebP image");if(file.size>5e6)throw Error("Image must be 5 MB or smaller");const path=`banners/${crypto.randomUUID()}.${file.type.split("/")[1]}`;ok(await sb.storage.from("site-assets").upload(path,file,{contentType:file.type,upsert:false}));const url=sb.storage.from("site-assets").getPublicUrl(path).data.publicUrl;await saveSiteSettings([{key:"hero_image_url",value:url},{key:"hero_image_path",value:path}]);await log("hero_image_uploaded",path);toast("Hero image updated");site()})}

 V(`<div class="glass"><h3>Published AURIX features</h3><p class="mu sm">These are the existing local app features shown on the public homepage. Usage and error telemetry are not collected because AURIX stores app data locally and does not report it to the website.</p>${FEATURE_KEYS.map(key=>`<section style="padding:14px 0;border-bottom:1px solid var(--line)"><h3>${labels[key]}</h3><label class="check"><input type="checkbox" data-enabled="${key}"${s[`feature_${key}_enabled`]!=="false"?" checked":""}>Show this feature on the homepage</label><label>Public title</label><input data-title="${key}" maxlength="100" value="${E(s[`feature_${key}_title`]||labels[key])}"><label>Description</label><textarea data-description="${key}" maxlength="500">${E(s[`feature_${key}_description`]||"")}</textarea><p class="mu sm">Usage: Not collected · Errors: Not collected</p></section>`).join("")}<button class="btn" id="saveFeatures" style="margin-top:16px">Save feature settings</button></div>`);

async function acct(){const [f,profile]=await Promise.all([sb.auth.mfa.listFactors(),sb.from("profiles").select("full_name,created_at").eq("id",me.id).maybeSingle()]);const factors=ok(f).totp.filter(x=>x.status==="verified"),adminProfile=ok(profile);
 V(`<div class="glass" style="margin-bottom:16px;max-width:520px"><h3>Administrator profile</h3><label>Display name</label><input id="adminDisplayName" maxlength="80" value="${E(adminProfile?.full_name||me.user_metadata?.full_name||"")}"><label>Verified account email</label><input value="${E(me.email)}" readonly><p class="mu sm">Last sign-in: ${fmt(me.last_sign_in_at)} · Registered: ${fmt(adminProfile?.created_at)}</p><button class="btn" id="saveAdminProfile">Save profile</button></div>

 <div class="glass" style="margin-bottom:16px;max-width:520px"><h3>Sessions</h3><p class="mu sm">Signing out globally revokes refresh sessions for this account on other devices. Access tokens may remain valid until their configured expiry.</p><button class="btn d" id="globalSignOut">Sign out all sessions</button></div>
 <div class="glass" style="max-width:520px"><h3>Two-factor authentication</h3><p class="mu sm">${factors.length?"Enabled ✓":"Not enabled. Strongly recommended for admins."}</p><div id="mq"></div>${factors.length?'<button class="btn d s" id="md">Disable 2FA</button>':'<button class="btn" id="me">Enable 2FA</button>'}</div>`);

 $("#pc").onclick=e=>run(e.target,async()=>{const a=$("#p1").value;if(a.length<12)throw Error("Use at least 12 characters");if(a!==$("#p2").value)throw Error("Passwords do not match");ok(await sb.auth.updateUser({password:a}));await log("password_changed","");toast("Password updated");$("#p1").value=$("#p2").value=""});
 $("#globalSignOut").onclick=e=>run(e.target,async()=>{if(!await ask("Sign out all sessions?","You will need to sign in again on every device."))return;await log("global_logout","");ok(await sb.auth.signOut({scope:"global"}));location.hash="";location.reload()});

  $("#vb").onclick=ev=>run(ev.target,async()=>{ok(await sb.auth.mfa.challengeAndVerify({factorId:r.id,code:$("#vc").value.trim()}));await log("2fa_enabled","");toast("2FA enabled");acct()})});

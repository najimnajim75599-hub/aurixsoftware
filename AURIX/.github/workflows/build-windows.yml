name: Build AURIX for Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
        env: { QT_QPA_PLATFORM: offscreen }
      - run: pyinstaller --noconfirm --clean aurix.spec
      - run: Compress-Archive -Path dist\AURIX\* -DestinationPath AURIX-Windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: AURIX-Windows, path: AURIX-Windows.zip }

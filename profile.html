<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#080808">
<meta name="description" content="The AURIX developer profile.">
<title>Developer · AURIX</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--black:#080808;--panel:#121212;--line:#262626;--red:#C51F32;--yellow:#F5C518;--white:#fff;--muted:#a8a8a8;--soft:#d6d6d6;--max:1040px}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font:16px/1.65 "Segoe UI",system-ui,sans-serif}a{color:var(--yellow);text-decoration:none}a:hover{color:#fff}.wrap{max-width:var(--max);margin:auto;padding:0 24px}
header{position:sticky;top:0;z-index:5;background:rgba(8,8,8,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:.22em}.brand svg{width:38px;height:26px}.nav a:last-child{padding:8px 13px;border:1px solid var(--line);border-radius:8px}
main{min-height:calc(100vh - 150px);padding:74px 0 90px;background:radial-gradient(850px 380px at 85% 0,rgba(197,31,50,.16),transparent 65%)}.eyebrow{margin:0 0 12px;color:var(--yellow);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.profile{display:grid;grid-template-columns:260px minmax(0,1fr);gap:54px;align-items:start}.portrait{width:220px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--red);background:var(--panel);display:grid;place-items:center;color:var(--yellow);font-size:4rem;font-weight:750}.portrait img{width:100%;height:100%;object-fit:cover}.identity h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.08;margin:0 0 8px;overflow-wrap:anywhere}.role{color:var(--yellow);font-size:1.15rem;margin:0}.location{color:var(--muted);margin:10px 0 0}.bio{margin:30px 0 0;color:var(--soft);white-space:pre-wrap;overflow-wrap:anywhere}.section{margin-top:32px}.section h2{margin:0 0 12px;font-size:1.05rem}.chips,.links{display:flex;flex-wrap:wrap;gap:9px}.chip,.links a{border:1px solid var(--line);border-radius:6px;padding:7px 11px;color:var(--soft);overflow-wrap:anywhere}.links a:hover{border-color:var(--yellow);color:var(--yellow)}.contact{display:inline-block;margin-top:24px;padding:11px 16px;background:var(--yellow);color:#111;font-weight:700;border-radius:7px}.contact:hover{background:#ffd633;color:#111}.state{max-width:640px;margin:12vh auto 0;padding:24px;border:1px solid var(--line);border-radius:8px;background:rgba(18,18,18,.8);color:var(--soft)}.state.error{border-color:rgba(197,31,50,.7)}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:.9rem}
@media(max-width:680px){.wrap{padding-inline:18px}main{padding:48px 0 64px}.profile{grid-template-columns:1fr;gap:26px}.portrait{width:min(190px,65vw);font-size:3.4rem}.bio{margin-top:22px}.nav{height:60px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="index-5.html" aria-label="AURIX home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" aria-hidden="true"><polygon points="42,66 60,10 78,66 69,66 60,38 51,66" fill="#FFFFFF"/><path d="M14 56 C 30 44, 78 34, 104 24 C 112 21, 112 30, 100 38 C 80 52, 34 66, 18 62 C 12 60, 11 58, 14 56 Z M 24 58 C 40 56, 84 44, 98 32 C 80 38, 40 52, 24 58 Z" fill="#C51F32" fill-rule="evenodd"/></svg>AURIX</a><a href="index-5.html">Back to AURIX</a></div></header>
<main><div class="wrap"><p class="eyebrow">AURIX / DEVELOPER</p><div id="profileState" class="state" role="status" aria-live="polite">Loading developer profile…</div><article id="profileContent" class="profile" hidden><div><div class="portrait"><img id="profilePhoto" alt="" hidden><span id="profileInitials" aria-hidden="true"></span></div><p id="profileLocation" class="location"></p><a id="profileEmail" class="contact" hidden>Contact</a></div><div class="identity"><h1 id="profileName"></h1><p id="profileTitle" class="role"></p><p id="profileBio" class="bio" hidden></p><section id="skillsSection" class="section" hidden><h2>Skills</h2><div id="profileSkills" class="chips"></div></section><section id="linksSection" class="section" hidden><h2>Links</h2><div id="profileLinks" class="links"></div></section></div></article></div></main>
<footer><div class="wrap">© <span id="year"></span> AURIX · <a href="index-5.html">Your World, Connected.</a></div></footer>
<script>
(()=>{
  const state=document.getElementById("profileState"),content=document.getElementById("profileContent");
  const setText=(id,value)=>{const element=document.getElementById(id);element.textContent=value||"";return element};
  const initials=name=>name.trim().split(/\s+/).map(part=>part[0]).slice(0,2).join("").toUpperCase();
  async function loadProfile(){
    const config=window.AURIX_CONFIG||{};
    if(!config.SUPABASE_URL||!config.SUPABASE_ANON_KEY||!window.supabase)throw new Error("AURIX profile service is not configured.");
    const client=supabase.createClient(config.SUPABASE_URL,config.SUPABASE_ANON_KEY);
    const {data,error}=await client.from("site_settings").select("key,value").in("key",["dev_name","dev_title","dev_location","dev_email","dev_bio","dev_skills","dev_links","dev_photo"]);
    if(error)throw error;
    const profile=Object.fromEntries((data||[]).map(row=>[row.key,row.value||""]));
    const name=profile.dev_name.trim();
    if(!name){state.textContent="The developer profile has not been published yet.";return;}
    document.title=`${name} · AURIX Developer`;
    const description=document.querySelector('meta[name="description"]');
    if(profile.dev_bio&&description)description.content=profile.dev_bio.slice(0,300);
    setText("profileName",name);setText("profileTitle",profile.dev_title.trim());setText("profileLocation",profile.dev_location.trim());
    const bio=setText("profileBio",profile.dev_bio.trim());bio.hidden=!bio.textContent;
    const initialsElement=setText("profileInitials",initials(name));
    if(profile.dev_photo){try{const photo=new URL(profile.dev_photo);if(photo.protocol==="https:"){const image=document.getElementById("profilePhoto");image.src=photo.href;image.hidden=false;initialsElement.hidden=true;}}catch{}}
    if(profile.dev_email){const email=document.getElementById("profileEmail");email.href=`mailto:${profile.dev_email.trim()}`;email.hidden=false;}
    const skills=profile.dev_skills.split(",").map(item=>item.trim()).filter(Boolean);
    const skillsContainer=document.getElementById("profileSkills");skills.forEach(skill=>{const chip=document.createElement("span");chip.className="chip";chip.textContent=skill;skillsContainer.append(chip);});
    document.getElementById("skillsSection").hidden=!skills.length;
    const linksContainer=document.getElementById("profileLinks");
    profile.dev_links.split(/\r?\n/).forEach(line=>{const separator=line.indexOf("|");if(separator<1)return;const label=line.slice(0,separator).trim(),rawUrl=line.slice(separator+1).trim();if(!label||!rawUrl)return;try{const url=new URL(rawUrl);if(url.protocol!=="https:")return;const link=document.createElement("a");link.href=url.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=label;linksContainer.append(link);}catch{}});
    document.getElementById("linksSection").hidden=!linksContainer.childElementCount;
    state.hidden=true;content.hidden=false;
  }
  document.getElementById("year").textContent=new Date().getFullYear();
  loadProfile().catch(error=>{state.classList.add("error");state.textContent=`Could not load the developer profile: ${error.message||"Supabase request failed."}`;});
})();
</script>
</body>
</html>
